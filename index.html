<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="HALE — modern fashion." />
  <title>HALE</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; width: 100%; }
    body {
      background: #fff;
      color: #080808;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    button, a { -webkit-tap-highlight-color: transparent; }

    .site-header {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 108px;
      padding: 0 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
    }

    .logo {
      color: #080808;
      text-decoration: none;
      font-size: 48px;
      line-height: 1;
      font-weight: 400;
      letter-spacing: 7px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .icon-button {
      position: relative;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #080808;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .icon-button svg {
      width: 30px;
      height: 30px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .notification-dot {
      position: absolute;
      top: -1px;
      right: 0;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff1f2d;
    }

    .hero {
      position: relative;
      width: 100%;
      height: calc(100svh - 108px);
      min-height: 620px;
      overflow: hidden;
      background: #222;
    }

    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center center;
    }

    .hero-copy {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 54%;
      width: min(72vw, 620px);
      transform: translate(-50%, -50%);
      text-align: center;
      color: #fff;
      pointer-events: none;
    }

    .hero-title {
      margin: 0;
      font-size: clamp(62px, 10.3vw, 112px);
      line-height: .84;
      font-weight: 800;
      letter-spacing: -5px;
      text-transform: uppercase;
    }

    .hero-title span { display: block; }

    .women-link {
      position: absolute;
      z-index: 3;
      right: 6.2%;
      top: 54.5%;
      transform: translateY(-50%);
      color: #fff;
      text-decoration: none;
      font-size: clamp(20px, 3vw, 35px);
      line-height: 1;
      font-weight: 400;
      letter-spacing: .5px;
      white-space: nowrap;
    }

    .women-link:hover { opacity: .72; }

    @media (max-width: 700px) {
      .site-header {
        height: 82px;
        padding: 0 24px;
      }

      .logo {
        font-size: 32px;
        letter-spacing: 5px;
      }

      .header-actions { gap: 17px; }
      .icon-button { width: 27px; height: 27px; }
      .icon-button svg { width: 27px; height: 27px; }
      .notification-dot { width: 7px; height: 7px; }

      .hero {
        height: calc(100svh - 82px);
        min-height: 540px;
      }

      .hero-copy {
        top: 54%;
        width: 82vw;
      }

      .hero-title {
        font-size: clamp(58px, 15vw, 100px);
        letter-spacing: -4px;
      }

      .women-link {
        top: 55%;
        right: 5%;
        font-size: clamp(15px, 4vw, 24px);
      }
    }

    @media (max-width: 430px) {
      .site-header { padding: 0 18px; }
      .header-actions { gap: 12px; }
      .hero-title { font-size: 62px; }
      .women-link { right: 4%; font-size: 15px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="#" aria-label="HALE home">HALE</a>

    <nav class="header-actions" aria-label="Main navigation">
      <button class="icon-button" aria-label="Search">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="14" cy="14" r="8.5"></circle>
          <path d="M20.5 20.5 28 28"></path>
        </svg>
      </button>

      <button class="icon-button" aria-label="Account">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="9.5" r="5.2"></circle>
          <path d="M6.5 28c.8-6 4.2-9.2 9.5-9.2s8.7 3.2 9.5 9.2"></path>
        </svg>
        <span class="notification-dot" aria-hidden="true"></span>
      </button>

      <button class="icon-button" aria-label="Shopping bag">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M7 11h18l1.2 17H5.8L7 11Z"></path>
          <path d="M11.5 11V8a4.5 4.5 0 0 1 9 0v3"></path>
        </svg>
      </button>

      <button class="icon-button" aria-label="Menu">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M4 8h24M4 16h24M4 24h24"></path>
        </svg>
      </button>
    </nav>
  </header>

  <main class="hero">
    <img
      class="hero-image"
      src="/file_000000003ddc8211854a6d12d54ef261.png"
      alt="HALE men's fashion campaign"
    />

    <div class="hero-copy">
      <h1 class="hero-title"><span>SHOP</span><span>MEN</span></h1>
    </div>

    <a class="women-link" href="#women">WOMEN &gt;</a>
  </main>
</body>
</html>
