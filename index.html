<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="HALE — modern fashion.">
<title>HALE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;background:#fff;color:#080808;font-family:Arial,Helvetica,sans-serif}body{overflow-x:hidden}
.site-header{height:48px;width:100%;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:30}.logo{font-size:20px;line-height:1;font-weight:400;letter-spacing:3.5px;text-decoration:none;color:#080808}.header-actions{display:flex;align-items:center;gap:8px}.icon-button{width:20px;height:20px;border:0;padding:0;background:transparent;color:#080808;display:grid;place-items:center;cursor:pointer;position:relative}.icon-button:hover{opacity:.58}.icon-button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.notification-dot{position:absolute;width:5px;height:5px;background:#ff1f2d;border-radius:50%;top:-1px;right:0}
.hero{position:relative;width:100%;height:calc(100svh - 48px);min-height:0;overflow:hidden;background:#171717}.hero-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom;display:block;transform:scale(1.08) translateY(-1%);transform-origin:center bottom}
.page-two{position:relative;width:100%;height:calc(100svh - 48px);min-height:650px;overflow:hidden;background:#111}.page-two-image{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:center bottom;transform:scale(1.08);transform-origin:center bottom}.page-two-label{position:absolute;left:28px;bottom:28px;color:#fff;font-size:12px;letter-spacing:2px;z-index:2}.page-two-link{position:absolute;inset:0;z-index:3;display:block}
.panel-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.22);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s ease}.panel-backdrop.open{opacity:1;pointer-events:auto}.panel{position:fixed;z-index:50;top:0;right:0;width:min(390px,88vw);height:100dvh;background:#fff;transform:translateX(100%);transition:transform .25s ease;padding:24px;box-shadow:-8px 0 30px rgba(0,0,0,.12);overflow-y:auto}.panel.open{transform:translateX(0)}.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.panel-title{font-size:22px;letter-spacing:1px;font-weight:500}.close-btn{border:0;background:none;font-size:28px;line-height:1;cursor:pointer;padding:0}.panel input{width:100%;height:46px;border:0;border-bottom:1px solid #111;outline:0;font-size:18px;background:transparent;margin-bottom:28px}.panel-link{display:block;color:#080808;text-decoration:none;font-size:18px;padding:15px 0;border-bottom:1px solid #ddd}.panel-link:hover{opacity:.55}.empty{color:#666;font-size:15px;line-height:1.5}.bag-count{margin-top:26px;padding-top:18px;border-top:1px solid #111;font-size:15px}
@media(max-width:700px){.site-header{height:48px;padding:0 14px}.logo{font-size:20px;letter-spacing:3.2px}.header-actions{gap:7px}.icon-button,.icon-button svg{width:19px;height:19px}.notification-dot{width:5px;height:5px}.hero,.page-two{height:calc(100svh - 48px)}.hero-image{transform:scale(1.08) translateY(-1%)}.page-two-image{object-position:center bottom;transform:scale(1.08)}}
@media(max-width:430px){.site-header{padding:0 12px}.header-actions{gap:6px}.logo{font-size:19px;letter-spacing:3px}}
</style>
</head>
<body>
<header class="site-header"><a class="logo" href="#top" aria-label="HALE home">HALE</a><nav class="header-actions" aria-label="Main navigation"><button class="icon-button" id="searchBtn" aria-label="Search" aria-controls="searchPanel" aria-expanded="false"><svg viewBox="0 0 32 32"><circle cx="14" cy="14" r="8.5"></circle><path d="M20.5 20.5 28 28"></path></svg></button><button class="icon-button" id="accountBtn" aria-label="Account" aria-controls="accountPanel" aria-expanded="false"><svg viewBox="0 0 32 32"><circle cx="16" cy="9.5" r="5.2"></circle><path d="M6.5 28c.8-6 4.2-9.2 9.5-9.2s8.7 3.2 9.5 9.2"></path></svg><span class="notification-dot"></span></button><button class="icon-button" id="bagBtn" aria-label="Shopping bag" aria-controls="bagPanel" aria-expanded="false"><svg viewBox="0 0 32 32"><path d="M7 11h18l1.2 17H5.8L7 11Z"></path><path d="M11.5 11V8a4.5 4.5 0 0 1 9 0v3"></path></svg></button><button class="icon-button" id="menuBtn" aria-label="Menu" aria-controls="menuPanel" aria-expanded="false"><svg viewBox="0 0 32 32"><path d="M4 8h24M4 16h24M4 24h24"></path></svg></button></nav></header>
<main id="top"><section class="hero" aria-label="HALE campaign"><img class="hero-image" src="/file_000000003ddc8211854a6d12d54ef261.png" alt="HALE campaign"></section><section class="page-two" id="men" aria-label="HALE men collection"><img class="page-two-image" src="/file_00000000fd1c82089c97e7890145f6e1.png" alt="HALE men's collection"><a class="page-two-link" href="#men" aria-label="Men collection"></a></section></main>
<div class="panel-backdrop" id="backdrop"></div><aside class="panel" id="searchPanel"><div class="panel-header"><div class="panel-title">SEARCH</div><button class="close-btn" data-close>×</button></div><input id="searchInput" type="search" placeholder="Search HALE" autocomplete="off"><div id="searchResult" class="empty">Search for products, collections or categories.</div></aside><aside class="panel" id="accountPanel"><div class="panel-header"><div class="panel-title">ACCOUNT</div><button class="close-btn" data-close>×</button></div><a class="panel-link" href="#" data-message="Sign in">SIGN IN</a><a class="panel-link" href="#" data-message="Create account">CREATE ACCOUNT</a><a class="panel-link" href="#" data-message="Orders">ORDERS</a></aside><aside class="panel" id="bagPanel"><div class="panel-header"><div class="panel-title">SHOPPING BAG</div><button class="close-btn" data-close>×</button></div><div class="empty">Your shopping bag is currently empty.</div><div class="bag-count">0 ITEMS</div></aside><aside class="panel" id="menuPanel"><div class="panel-header"><div class="panel-title">MENU</div><button class="close-btn" data-close>×</button></div><a class="panel-link" href="#men" data-message="Women">WOMEN</a><a class="panel-link" href="#men">MEN</a><a class="panel-link" href="#men">NEW ARRIVALS</a><a class="panel-link" href="#men">COLLECTIONS</a><a class="panel-link" href="#top">HOME</a></aside>
<script>const panels={search:document.getElementById('searchPanel'),account:document.getElementById('accountPanel'),bag:document.getElementById('bagPanel'),menu:document.getElementById('menuPanel')};const buttons={search:document.getElementById('searchBtn'),account:document.getElementById('accountBtn'),bag:document.getElementById('bagBtn'),menu:document.getElementById('menuBtn')};const backdrop=document.getElementById('backdrop');function closePanels(){Object.values(panels).forEach(p=>p.classList.remove('open'));Object.values(buttons).forEach(b=>b.setAttribute('aria-expanded','false'));backdrop.classList.remove('open');document.body.style.overflow=''}function openPanel(name){closePanels();panels[name].classList.add('open');buttons[name].setAttribute('aria-expanded','true');backdrop.classList.add('open');document.body.style.overflow='hidden';if(name==='search')setTimeout(()=>document.getElementById('searchInput').focus(),180)}Object.keys(buttons).forEach(name=>buttons[name].addEventListener('click',()=>panels[name].classList.contains('open')?closePanels():openPanel(name)));document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closePanels));backdrop.addEventListener('click',closePanels);document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanels()});document.querySelectorAll('.panel-link[data-message]').forEach(l=>l.addEventListener('click',e=>{if(l.getAttribute('href')==='#'){e.preventDefault();alert(l.dataset.message+' section is ready for products/pages to be connected.')}}));document.getElementById('searchInput').addEventListener('input',e=>{const q=e.target.value.trim();document.getElementById('searchResult').textContent=q?`Search results for “${q}” will appear here.`:'Search for products, collections or categories.'});</script>
</body>
</html>
