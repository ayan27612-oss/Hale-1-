<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HALE — modern fashion." />
  <title>HALE</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #080808;
      overflow-x: hidden;
    }

    .site-header {
      height: 108px;
      width: 100%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 54px;
      position: relative;
      z-index: 10;
    }

    .logo {
      font-size: 48px;
      line-height: 1;
      font-weight: 400;
      letter-spacing: 7px;
      text-decoration: none;
      color: #080808;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .icon-button {
      width: 32px;
      height: 32px;
      border: 0;
      padding: 0;
      background: transparent;
      color: #080808;
      display: grid;
      place-items: center;
      cursor: pointer;
      position: relative;
    }

    .icon-button svg {
      width: 30px;
      height: 30px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .notification-dot {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #ff1f2d;
      border-radius: 50%;
      top: 0;
      right: 1px;
    }

    .hero {
      position: relative;
      width: 100%;
      height: calc(100vh - 108px);
      min-height: 600px;
      overflow: hidden;
      background: #171717;
    }

    /* The uploaded image is a screenshot, so crop its baked-in top UI. */
    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center bottom;
      display: block;
      transform: scale(1.15) translateY(-2%);
      transform-origin: center bottom;
    }

    @media (max-width: 700px) {
      .site-header {
        height: 64px;
        padding: 0 18px;
      }

      .logo {
        font-size: 29px;
        letter-spacing: 4px;
      }

      .header-actions {
        gap: 14px;
      }

      .icon-button {
        width: 24px;
        height: 24px;
      }

      .icon-button svg {
        width: 24px;
        height: 24px;
        stroke-width: 1.7;
      }

      .notification-dot {
        width: 6px;
        height: 6px;
        top: -1px;
        right: 0;
      }

      .hero {
        height: calc(100svh - 64px);
        min-height: 0;
      }

      .hero-image {
        transform: scale(1.15) translateY(-2%);
      }
    }

    @media (max-width: 430px) {
      .site-header {
        padding: 0 16px;
      }

      .logo {
        font-size: 27px;
        letter-spacing: 3.5px;
      }

      .header-actions {
        gap: 11px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="#" aria-label="HALE home">HALE</a>

    <nav class="header-actions" aria-label="Main navigation">
      <button class="icon-button" aria-label="Search">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="14" cy="14" r="8.5"></circle>
          <path d="M20.5 20.5 28 28"></path>
        </svg>
      </button>

      <button class="icon-button" aria-label="Account">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="9.5" r="5.2"></circle>
          <path d="M6.5 28c.8-6 4.2-9.2 9.5-9.2s8.7 3.2 9.5 9.2"></path>
        </svg>
        <span class="notification-dot" aria-hidden="true"></span>
      </button>

      <button class="icon-button" aria-label="Shopping bag">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M7 11h18l1.2 17H5.8L7 11Z"></path>
          <path d="M11.5 11V8a4.5 4.5 0 0 1 9 0v3"></path>
        </svg>
      </button>

      <button class="icon-button" aria-label="Menu">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M4 8h24M4 16h24M4 24h24"></path>
        </svg>
      </button>
    </nav>
  </header>

  <main class="hero">
    <img
      class="hero-image"
      src="/file_000000003ddc8211854a6d12d54ef261.png"
      alt="HALE campaign"
    />
  </main>
</body>
</html>
