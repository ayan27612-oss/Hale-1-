<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HALE — modern fashion." />
  <title>HALE</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #080808;
      overflow-x: hidden;
    }

    .site-header {
      height: 108px;
      width: 100%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 54px;
      position: relative;
      z-index: 10;
    }

    .logo {
      font-size: 48px;
      line-height: 1;
      font-weight: 400;
      letter-spacing: 7px;
      text-decoration: none;
      color: #080808;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .icon-button {
      width: 32px;
      height: 32px;
      border: 0;
      padding: 0;
      background: transparent;
      color: #080808;
      display: grid;
      place-items: center;
      cursor: pointer;
      position: relative;
    }

    .icon-button svg {
      width: 30px;
      height: 30px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .notification-dot {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #ff1f2d;
      border-radius: 50%;
      top: 0;
      right: 1px;
    }

    .hero {
      position: relative;
      width: 100%;
      height: calc(100vh - 108px);
      min-height: 650px;
      overflow: hidden;
      background: #171717;
    }

    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* Replace /assets/hero.jpg with the supplied campaign image later. */
    .image-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        linear-gradient(115deg, rgba(220,220,220,.16), rgba(20,20,20,.7)),
        #303030;
      color: rgba(255,255,255,.45);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .image-placeholder span { margin-top: 25vh; }

    .hero-copy {
      position: absolute;
      left: 50%;
      top: 53.8%;
      transform: translate(-50%, -50%);
      z-index: 2;
      text-align: center;
      color: #fff;
      width: min(72vw, 620px);
    }

    .hero-title {
      margin: 0;
      font-size: clamp(62px, 10.3vw, 112px);
      line-height: .84;
      font-weight: 800;
      letter-spacing: -5px;
      text-transform: uppercase;
    }

    .hero-title span { display: block; }

    .women-link {
      position: absolute;
      right: 6.2%;
      top: 54.5%;
      transform: translateY(-50%);
      z-index: 3;
      color: #fff;
      text-decoration: none;
      font-size: clamp(20px, 3vw, 35px);
      line-height: 1;
      font-weight: 400;
      letter-spacing: .5px;
      white-space: nowrap;
    }

    .women-link:hover { opacity: .72; }

    @media (max-width: 700px) {
      .site-header {
        height: 82px;
        padding: 0 24px;
      }
      .logo {
        font-size: 32px;
        letter-spacing: 5px;
      }
      .header-actions { gap: 17px; }
      .icon-button { width: 27px; height: 27px; }
      .icon-button svg { width: 27px; height: 27px; }
      .notification-dot { width: 7px; height: 7px; }
      .hero { height: calc(100svh - 82px); min-height: 540px; }
      .hero-copy { top: 54%; width: 82vw; }
      .hero-title {
        font-size: clamp(58px, 15vw, 100px);
        letter-spacing: -4px;
      }
      .women-link {
        top: 55%;
        right: 5%;
        font-size: clamp(15px, 4vw, 24px);
      }
    }

    @media (max-width: 430px) {
      .site-header { padding: 0 18px; }
      .header-actions { gap: 12px; }
      .hero-title { font-size: 62px; }
      .women-link { font-size: 15px; right: 4%; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="#" aria-label="HALE home">HALE</a>

    <nav class="header-actions" aria-label="Main navigation">
      <button class="icon-button" aria-label="Search">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="14" cy="14" r="8.5"></circle>
          <path d="M20.5 20.5 28 28"></path>
        </svg>
      </button>

      <button class="icon-button" aria-label="Account">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="9.5" r="5.2"></circle>
          <path d="M6.5 28c.8-6 4.2-9.2 9.5-9.2s8.7 3.2 9.5 9.2"></path>
        </svg>
        <span class="notification-dot" aria-hidden="true"></span>
      </button>

      <button class="icon-button" aria-label="Shopping bag">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M7 11h18l1.2 17H5.8L7 11Z"></path>
          <path d="M11.5 11V8a4.5 4.5 0 0 1 9 0v3"></path>
        </svg>
      </button>

      <button class="icon-button" aria-label="Menu">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M4 8h24M4 16h24M4 24h24"></path>
        </svg>
      </button>
    </nav>
  </header>

  <main class="hero">
    <img class="hero-image" src="/assets/hero.jpg" alt="HALE campaign models" onerror="this.style.display='none'; document.querySelector('.image-placeholder').style.display='grid';" />
    <div class="image-placeholder" aria-hidden="true"><span>Replace with hero.jpg</span></div>

    <div class="hero-copy">
      <h1 class="hero-title"><span>SHOP</span><span>MEN</span></h1>
    </div>

    <a class="women-link" href="#women">WOMEN &gt;</a>
  </main>
</body>
</html>
